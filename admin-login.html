<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Little Angels Modern High School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Global Styles */
        :root {
            --primary-color: #000000;
            --secondary-color: #ffffff;
            --accent-color: #3498db;
            --gray-light: #f5f5f5;
            --gray-mid: #e0e0e0;
            --gray-dark: #333333;
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--primary-color);
            background-color: var(--gray-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            border-radius: 5px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: var(--transition);
            cursor: pointer;
            border: 2px solid var(--primary-color);
        }

        .btn:hover {
            background-color: transparent;
            color: var(--primary-color);
        }

        /* Header Styles */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--secondary-color);
            z-index: 1000;
            box-shadow: var(--shadow);
            padding: 15px 0;
            transition: var(--transition);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 50px;
            margin-right: 15px;
        }

        .logo h1 {
            font-size: 1.4rem;
            margin-bottom: 0;
            font-weight: 700;
        }

        nav ul {
            display: flex;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            font-weight: 500;
            position: relative;
            padding-bottom: 5px;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent-color);
        }

        nav ul li a:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent-color);
            transition: var(--transition);
        }

        nav ul li a:hover:after, nav ul li a.active:after {
            width: 100%;
        }

        .hamburger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 20px;
        }

        .hamburger span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: var(--primary-color);
            transition: var(--transition);
        }

        /* Login Section */
        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            margin-top: 80px;
        }

        .login-container {
            max-width: 450px;
            width: 90%;
            background-color: var(--secondary-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .login-header {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            padding: 25px 30px;
            text-align: center;
        }

        .login-header h2 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .login-header p {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .login-form {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group .input-with-icon {
            position: relative;
        }

        .form-group .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-dark);
            opacity: 0.7;
        }

        .form-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid var(--gray-mid);
            border-radius: 5px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .form-group .forgot-password {
            position: absolute;
            right: 0;
            top: 0;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .remember-me input {
            margin-right: 10px;
        }

        .login-form .btn {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
        }

        .back-to-home {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .back-to-home a {
            color: var(--accent-color);
            font-weight: 500;
        }

        .back-to-home a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            padding: 20px 0;
            text-align: center;
        }

        footer p {
            margin-bottom: 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            header {
                padding: 10px 0;
            }

            .logo img {
                height: 40px;
            }

            .logo h1 {
                font-size: 1.2rem;
            }

            nav {
                position: fixed;
                top: 80px;
                left: -100%;
                width: 80%;
                height: calc(100vh - 80px);
                background-color: var(--secondary-color);
                box-shadow: var(--shadow);
                transition: var(--transition);
                z-index: 999;
            }

            nav.active {
                left: 0;
            }

            nav ul {
                flex-direction: column;
                padding: 40px 20px;
            }

            nav ul li {
                margin: 0 0 20px 0;
            }

            .hamburger {
                display: flex;
            }

            .login-container {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="Little Angels Modern High School">
                <h1>Little Angels Modern High School</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="admission.html">Admission</a></li>
                    <li><a href="index.html#courses">Courses</a></li>
                    <li><a href="admin-login.html" class="active">Admin Login</a></li>
                </ul>
            </nav>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <div class="login-header">
                <h2>Admin Portal</h2>
                <p>Login to access the school management system</p>
            </div>
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                
                <button type="submit" class="btn">Login</button>
                
                <div class="back-to-home">
                    <p>Not an admin? <a href="index.html">Return to home page</a></p>
                </div>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Little Angels Modern High School. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Mobile Menu Toggle
        const hamburger = document.querySelector('.hamburger');
        const nav = document.querySelector('nav');

        hamburger.addEventListener('click', () => {
            nav.classList.toggle('active');
            
            // Animate hamburger
            const spans = hamburger.querySelectorAll('span');
            spans[0].classList.toggle('rotate-down');
            spans[1].classList.toggle('fade-out');
            spans[2].classList.toggle('rotate-up');
        });

        // Login Form
        const loginForm = document.getElementById('loginForm');
        
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Here you would normally validate and send credentials to server
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username && password) {
                // Simulating login attempt
                alert('Login functionality would be implemented here in a real application.');
                // In a real application, you would redirect to the admin dashboard after successful login
            } else {
                alert('Please enter both username and password.');
            }
        });

        // Add CSS for hamburger animation
        const style = document.createElement('style');
        style.textContent = `
            .hamburger span {
                transition: all 0.3s ease;
                transform-origin: center;
            }
            
            .hamburger .rotate-down {
                transform: translateY(9px) rotate(45deg);
            }
            
            .hamburger .fade-out {
                opacity: 0;
            }
            
            .hamburger .rotate-up {
                transform: translateY(-9px) rotate(-45deg);
            }
        `;
        
        document.head.appendChild(style);
    </script>
</body>
</html>
